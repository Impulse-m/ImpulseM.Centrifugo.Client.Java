name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v, e.g. 1.0.0 or 1.1.0-rc.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve and validate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi

          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::Invalid version '${version}'. Expected semver without the leading v, e.g. 1.0.0 or 1.1.0-rc.1."
            exit 1
          fi

          tag="v${version}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            remote_tag="$(git ls-remote --tags origin "refs/tags/${tag}")"
            if [ -n "$remote_tag" ]; then
              echo "::error::Tag ${tag} already exists on origin."
              exit 1
            fi
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::GitHub Release ${tag} already exists."
            exit 1
          fi

          if [ "$prerelease" = "false" ]; then
            highest="$(gh release list --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName' | sed 's/^v//' | sort -V | tail -n 1)"
            if [ -n "$highest" ]; then
              newest="$(printf '%s\n%s\n' "$highest" "$version" | sort -V | tail -n 1)"
              if [ "$highest" = "$version" ] || [ "$newest" != "$version" ]; then
                echo "::error::Version ${version} is not greater than the latest release v${highest}."
                exit 1
              fi
            fi
          fi

          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs:
      - validate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build artifacts
    needs:
      - validate
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Assemble library
        run: ./gradlew :centrifuge:assemble --no-daemon

      - name: Check the license notices in the library jar
        run: |
          checked=0
          for jar in centrifuge/build/libs/*.jar; do
            case "$jar" in
              *-sources.jar|*-javadoc.jar) continue ;;
            esac
            checked=$((checked + 1))
            jar tf "$jar" > "$RUNNER_TEMP/jar-entries.txt"
            for entry in META-INF/LICENSE META-INF/THIRD_PARTY_NOTICES.md; do
              if ! grep -qx "$entry" "$RUNNER_TEMP/jar-entries.txt"; then
                echo "::error::${jar} has no ${entry}."
                exit 1
              fi
            done
          done
          if [ "$checked" -eq 0 ]; then
            echo "::error::No library jar was built."
            exit 1
          fi

      - name: Upload library archive
        uses: actions/upload-artifact@v4
        with:
          name: release-jar
          path: centrifuge/build/libs/*.jar
          if-no-files-found: error

  publish:
    name: Publish to GitHub Pages Maven repository
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      PAGES_DIR: gh-pages
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create gh-pages branch if missing
        run: |
          set +e
          git ls-remote --exit-code --heads origin gh-pages >/dev/null
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "gh-pages branch already exists."
            exit 0
          fi
          if [ "$rc" -ne 2 ]; then
            echo "::error::Could not query origin for the gh-pages branch (exit ${rc})."
            exit 1
          fi

          # Orphan commit containing only .nojekyll, so Pages serves the
          # Maven layout as-is (no Jekyll processing).
          blob="$(printf '' | git hash-object -w --stdin)"
          tree="$(printf '100644 blob %s\t.nojekyll\n' "$blob" | git mktree)"
          commit="$(git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit-tree "$tree" -m "Initialize gh-pages")"
          git push origin "${commit}:refs/heads/gh-pages"

      - name: Check out gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: ${{ env.PAGES_DIR }}

      - name: Refuse to overwrite an existing version
        run: |
          target="${PAGES_DIR}/com/github/Impulse-m/ImpulseM.Centrifugo.Client.Java/${VERSION}"
          if [ -e "$target" ]; then
            echo "::error::Version ${VERSION} is already published in gh-pages. Maven versions are immutable; bump the version."
            exit 1
          fi

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Publish to gh-pages directory
        run: >-
          ./gradlew :centrifuge:publishAllPublicationsToGhPagesRepository
          --no-daemon
          -PghPagesRepo="${GITHUB_WORKSPACE}/${PAGES_DIR}"

      - name: Commit and push gh-pages
        working-directory: ${{ env.PAGES_DIR }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Publishing ${VERSION} produced no changes."
            exit 1
          fi
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Publish ${VERSION}"
          git push origin HEAD:gh-pages

  verify:
    name: Verify GitHub Pages artifact
    needs:
      - validate
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check that GitHub Pages is enabled
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" || true)"
          if [ "$code" = "404" ]; then
            echo "::error::GitHub Pages is not enabled for ${GITHUB_REPOSITORY}. Enable it under Settings > Pages with source 'Deploy from a branch' and branch 'gh-pages', then re-run this workflow."
            exit 1
          fi
          echo "GitHub Pages API responded with HTTP ${code}."

      - name: Wait for the POM to be served
        run: |
          pom="https://impulse-m.github.io/ImpulseM.Centrifugo.Client.Java/com/github/Impulse-m/ImpulseM.Centrifugo.Client.Java/${VERSION}/ImpulseM.Centrifugo.Client.Java-${VERSION}.pom"
          deadline=$((SECONDS + 600))

          # Pages deploys asynchronously after the push, so poll until served.
          while true; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$pom" || true)"
            echo "POM HTTP ${code}: ${pom}"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out after 10 minutes waiting for ${pom} (last HTTP ${code})."
              exit 1
            fi
            sleep 15
          done

  tag:
    name: Create tag
    needs:
      - validate
      - build
      - verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create and push tag
        run: |
          git tag "v${VERSION}" "$GITHUB_SHA"
          git push origin "refs/tags/v${VERSION}"

  release:
    name: Tag and publish release
    needs:
      - validate
      - build
      - verify
      - tag
    # tag is skipped for tag pushes, which is still a valid path.
    if: ${{ always() && needs.build.result == 'success' && needs.verify.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download library archive
        uses: actions/download-artifact@v4
        with:
          name: release-jar
          path: dist

      - name: Create GitHub Release
        run: |
          args=(--verify-tag --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi

          gh release create "v${VERSION}" "${args[@]}" dist/*.jar
