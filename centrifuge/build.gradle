import com.vanniktech.maven.publish.JavaLibrary
import com.vanniktech.maven.publish.JavadocJar

plugins {
    id "java-library"
    id "maven-publish"
    id "signing"
    id 'me.tylerbwong.gradle.metalava'
    id "com.google.protobuf" version "0.9.4"
}

apply plugin: "com.vanniktech.maven.publish.base"

// See https://github.com/vanniktech/gradle-maven-publish-plugin#base-plugin
mavenPublishing {
    configure(new JavaLibrary(new JavadocJar.Javadoc(), true))
}

publishing {
    publications.all {
        // Coordinates stay stable across releases: <group>:ImpulseM.Centrifugo.Client.Java.
        artifactId = 'ImpulseM.Centrifugo.Client.Java'
    }

    repositories {
        // Plain Maven layout written to a local directory. The release workflow
        // points this at a checkout of the gh-pages branch, which GitHub Pages
        // serves as the consumer-facing Maven repository.
        maven {
            name = 'GhPages'
            String repoPath = project.findProperty('ghPagesRepo') ?: System.getenv('GH_PAGES_REPO') ?: "${layout.buildDirectory.get().asFile}/gh-pages-maven"
            url = new File(repoPath).toURI()
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// The binary jar carries the license of the library and the notices of the
// third-party code it contains (the Fossil delta port, BSD 2-Clause), so they
// reach every consumer of the Maven artifacts, not only the repository.
jar {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }
    from(rootProject.file('THIRD_PARTY_NOTICES.md')) {
        into 'META-INF'
    }
}

// protobuf-gradle-plugin 0.9.x already wires the generated proto sources
// into `sourceSets.main.java` and the corresponding task dependencies. We
// only need to declare the integrationTest source set here.
sourceSets {
    integrationTest {
        java.srcDir 'src/integrationTest/java'
        resources.srcDir 'src/integrationTest/resources'
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    api 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.protobuf:protobuf-javalite:3.25.5'
    implementation 'net.sourceforge.streamsupport:streamsupport-minifuture:1.7.4'

    testImplementation 'junit:junit:4.13.2'
    // In-process WebSocket server for channel compaction tests (the feature is
    // Centrifugo PRO only, so it can't be exercised against the OSS server).
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

task integrationTest(type: Test) {
    description = 'Runs integration tests against a running Centrifugo (see docker-compose.yml).'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter test
    useJUnit()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
    // Endpoint can be overridden when Centrifugo runs somewhere else.
    systemProperty 'centrifuge.endpoint',
            System.getProperty('centrifuge.endpoint', 'ws://localhost:8000/connection/websocket')
    systemProperty 'centrifuge.tokenSecret',
            System.getProperty('centrifuge.tokenSecret', 'secret')
}

protobuf {
    protoc {
        // Matches the runtime version of protobuf-javalite above.
        artifact = "com.google.protobuf:protoc:3.25.5"
    }

    generateProtoTasks {
        all().configureEach {
            builtins {
                java {
                    option("lite")
                }
            }
        }
    }
}

javadoc {
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}

metalava {
    hiddenPackages.add("io.github.centrifugal.centrifuge.internal")
}

test {
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}
