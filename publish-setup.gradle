allprojects {
    plugins.withId("com.vanniktech.maven.publish.base") {
        // JitPack sets VERSION to the git tag (e.g. v1.0.0). The leading v is
        // stripped so the POM carries 1.0.0. Without VERSION the default is kept.
        String envVersion = System.getenv("VERSION")
        String defaultVersion = "0.7.0"
        String resolvedVersion = envVersion ? envVersion.trim().replaceFirst(/^v/, '') : defaultVersion

        project.group = "com.github.Impulse-m"
        project.version = resolvedVersion

        mavenPublishing {
            // Sonatype Central Portal (replaces legacy OSSRH). The boolean
            // arg enables auto-release: artifacts go live on Maven Central
            // ~30 min after the release task completes. Passing the host as
            // a String avoids importing SonatypeHost (the plugin's classpath
            // isn't visible to this `apply from:` script).
            publishToMavenCentral("CENTRAL_PORTAL", true)

            // Signing is applied only when signing credentials are configured,
            // so local and JitPack builds (publishToMavenLocal) need no keys.
            String signingKey = project.findProperty("signingInMemoryKey") as String
            String signingKeyId = project.findProperty("signing.keyId") as String
            boolean hasSigningCredentials = signingKey || signingKeyId
            if (hasSigningCredentials) {
                signAllPublications()
            }

            pom {
                name = 'Centrifuge Java'
                description = 'Android and General Java client for Centrifugo server and Centrifuge library'
                url = 'https://github.com/Impulse-m/ImpulseM.Centrifugo.Client.Java'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'http://www.opensource.org/licenses/mit-license.php'
                    }
                }

                developers {
                    developer {
                        id = 'FZambia'
                        name = 'Alexander Emelin'
                        email = 'frvzmb@gmail.com'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/Impulse-m/ImpulseM.Centrifugo.Client.Java.git'
                    developerConnection = 'scm:git:ssh://git@github.com/Impulse-m/ImpulseM.Centrifugo.Client.Java.git'
                    url = 'https://github.com/Impulse-m/ImpulseM.Centrifugo.Client.Java'
                }
            }
        }
    }
}
